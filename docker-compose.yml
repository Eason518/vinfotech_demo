services:
  vinfotech:
    image: ghcr.io/eason518/vinfotech_demo:latest
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vinfotech.rule=Host(`vinfotech.easonai.io`)"
      - "traefik.http.routers.vinfotech.entrypoints=websecure"
      - "traefik.http.routers.vinfotech.tls.certresolver=letsencrypt"
      - "traefik.http.services.vinfotech.loadbalancer.server.port=80"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.vinfotech-http.rule=Host(`vinfotech.easonai.io`)"
      - "traefik.http.routers.vinfotech-http.entrypoints=web"
      - "traefik.http.routers.vinfotech-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
